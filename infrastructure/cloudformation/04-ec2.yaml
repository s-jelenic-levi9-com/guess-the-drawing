AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Backend Server for Guess the Drawing Game'

Parameters:
  EnvironmentName:
    Type: String
    Default: guess-drawing
    Description: Environment name prefix

  InstanceType:
    Type: String
    Default: t2.micro
    Description: EC2 instance type
    AllowedValues:
      - t2.micro
      - t3.micro

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of an existing EC2 KeyPair for SSH access
    ConstraintDescription: Must be the name of an existing EC2 KeyPair

Mappings:
  AWSRegionToAMI:
    us-east-1:
      AMI: ami-0c101f26f147fa7fd  # Amazon Linux 2023
    us-west-2:
      AMI: ami-0efb097fb8fd3e739
    eu-west-1:
      AMI: ami-045b17fd099062e5d  # Amazon Linux 2023 x86_64

Resources:
  # Elastic IP
  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-backend-eip'

  # EC2 Instance
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [AWSRegionToAMI, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - Fn::ImportValue: !Sub '${EnvironmentName}-ec2-sg-id'
          SubnetId:
            Fn::ImportValue: !Sub '${EnvironmentName}-public-subnet-1'
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          
          # Log everything - DO NOT use set -e (we handle errors manually)
          exec > >(tee /var/log/user-data.log) 2>&1
          
          echo "========================================="
          echo "EC2 Setup Started"
          date
          echo "========================================="
          
          # 1. Install system packages
          echo ">>> Installing packages..."
          yum update -y
          curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
          yum install -y nodejs git postgresql15
          
          # 2. Install global npm packages
          echo ">>> Installing PM2 and TypeScript globally..."
          npm install -g pm2 typescript
          
          # Verify installations
          echo "Node version:"
          node --version
          echo "npm version:"
          npm --version
          echo "PM2 version:"
          pm2 --version
          echo "TypeScript version:"
          tsc --version
          
          # 3. Clone repository
          echo ">>> Cloning repository..."
          mkdir -p /home/ec2-user/apps
          cd /home/ec2-user/apps
          rm -rf my-bmad
          git clone https://github.com/s-jelenic-levi9-com/guess-the-drawing.git my-bmad
          
          # 4. Create .env file
          echo ">>> Creating .env file..."
          cat > /home/ec2-user/apps/my-bmad/guess-drawing-backend/.env << ENVEOF
          NODE_ENV=production
          PORT=3000
          DATABASE_SSL=true
          AWS_REGION=${AWS::Region}
          USE_SECRETS_MANAGER=true
          ENVIRONMENT_NAME=guess-drawing
          ENVEOF
          sed -i 's/^[[:space:]]*//' /home/ec2-user/apps/my-bmad/guess-drawing-backend/.env
          echo "Created .env:"
          cat /home/ec2-user/apps/my-bmad/guess-drawing-backend/.env
          
          # 5. Fix ownership
          chown -R ec2-user:ec2-user /home/ec2-user/apps
          
          # 6. Install dependencies and build (as ec2-user)
          echo ">>> Installing dependencies and building..."
          cd /home/ec2-user/apps/my-bmad/guess-drawing-backend
          
          # Delete lock file to avoid sync issues, use fresh install
          rm -f package-lock.json
          
          sudo -u ec2-user npm install
          sudo -u ec2-user npm run build
          
          # 7. Verify build succeeded
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: Build failed - dist/index.js not found"
            ls -la dist/ 2>/dev/null || echo "dist folder missing"
            exit 1
          fi
          echo "Build successful:"
          ls -lh dist/index.js
          
          # 8. Start with PM2
          echo ">>> Starting PM2..."
          sudo -u ec2-user pm2 start dist/index.js --name guess-drawing-backend
          sudo -u ec2-user pm2 save
          
          # 9. Configure PM2 startup
          env PATH=/usr/local/bin:/usr/bin:/bin pm2 startup systemd -u ec2-user --hp /home/ec2-user
          systemctl enable pm2-ec2-user || echo "PM2 service enable skipped"
          
          # 10. Health check
          echo ">>> Waiting for backend to start..."
          sleep 5
          curl -s http://localhost:3000/api/v1/health || echo "Health check pending - backend may still be starting"
          
          echo "========================================="
          echo "EC2 Setup Complete"
          date
          echo "========================================="
          sudo -u ec2-user pm2 status

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-backend'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Associate Elastic IP
  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      EIP: !Ref ElasticIP

  # IAM Role for EC2
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:guess-drawing/*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ec2-role'

  # Instance Profile
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-ec2-profile'
      Roles:
        - !Ref EC2Role

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
    Export:
      Name: !Sub '${EnvironmentName}-ec2-instance-id'

  ElasticIP:
    Description: Elastic IP Address
    Value: !Ref ElasticIP
    Export:
      Name: !Sub '${EnvironmentName}-backend-ip'

  BackendURL:
    Description: Backend API URL
    Value: !Sub 'http://${ElasticIP}:3000'
    Export:
      Name: !Sub '${EnvironmentName}-backend-url'

  WebSocketURL:
    Description: WebSocket URL
    Value: !Sub 'ws://${ElasticIP}:3000'
    Export:
      Name: !Sub '${EnvironmentName}-ws-url'

  SSHCommand:
    Description: SSH command to connect to the instance
    Value: !Sub 'ssh -i ~/.ssh/${KeyName}.pem ec2-user@${ElasticIP}'
